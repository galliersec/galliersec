<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="GallierSec cyber terminal profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#13091f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e7ff"/>
      <stop offset="0.5" stop-color="#7b2cff"/>
      <stop offset="1" stop-color="#bd00ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00e7ff" stroke-width="0.45" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="17" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.9"/>
  <rect x="0" y="48" width="1200" height="372" fill="url(#grid)" opacity="0.5"/>

  <!-- terminal top bar -->
  <rect x="0" y="0" width="1200" height="48" rx="18" fill="#0b1018"/>
  <rect x="0" y="31" width="1200" height="17" fill="#0b1018"/>
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="24" r="6" fill="#27c93f"/>
  <text x="600" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#8b949e" letter-spacing="2">root@galliersec: ~/profile</text>
  <text x="1165" y="30" text-anchor="end" font-family="monospace" font-size="10" fill="#00e7ff" letter-spacing="2">SESSION::ACTIVE</text>

  <!-- chromatic title -->
  <g font-family="monospace" font-size="72" font-weight="700" text-anchor="middle" filter="url(#glow)">
    <text x="597" y="136" fill="#bd00ff" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="-2 1;-1 -1;-2 1" dur="0.22s" repeatCount="indefinite"/>
      GALLIERSEC
    </text>
    <text x="603" y="136" fill="#00e7ff" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="2 -1;1 1;2 -1" dur="0.22s" repeatCount="indefinite"/>
      GALLIERSEC
    </text>
    <text x="600" y="136" fill="#e6edf3">GALLIERSEC</text>
  </g>

  <text x="600" y="166" text-anchor="middle" font-family="monospace" font-size="13" fill="#00ff9c" letter-spacing="5">// CYBERSECURITY · PENTEST · SYSTEMS</text>

  <!-- prompt block -->
  <g font-family="monospace" font-size="17">
    <text x="78" y="220" fill="#bd00ff">┌──(galliersec㉿security-lab)-[~]</text>
    <text x="78" y="250" fill="#00e7ff">└─$ whoami</text>
    <text x="235" y="250" fill="#e6edf3">Arthur Gallier // ADS Student</text>

    <text x="78" y="286" fill="#00e7ff">└─$ cat focus.txt</text>
    <text x="275" y="286" fill="#e6edf3">pentest · linux · networking · backend</text>

    <text x="78" y="322" fill="#00e7ff">└─$ status --learning</text>
    <text x="316" y="322" fill="#00ff9c">ACTIVE</text>
    <text x="390" y="322" fill="#8b949e">// building, testing, documenting</text>

    <text x="78" y="358" fill="#00e7ff">└─$ _</text>
    <rect x="147" y="343" width="10" height="20" fill="#00e7ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- corner telemetry -->
  <g font-family="monospace" font-size="10" letter-spacing="2">
    <text x="78" y="398" fill="#8b949e">NODE: BR-01</text>
    <text x="250" y="398" fill="#00e7ff">SIGNAL: STABLE</text>
    <text x="440" y="398" fill="#bd00ff">MODE: RECON</text>
    <text x="1122" y="398" text-anchor="end" fill="#00ff9c">ACCESS GRANTED</text>
  </g>

  <!-- scan line -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#00e7ff" stroke-width="1" opacity="0.16">
    <animate attributeName="y1" values="58;414;58" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="58;414;58" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
